# One-click deploy on Render (https://render.com) → New → Blueprint → pick this repo.
services:
  - type: web
    name: paypilot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_CURRENCY
        value: USD
      - key: CRON_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: APP_TIMEZONE
        value: America/New_York
