<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Receipt</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { background: #09090b; min-height: 100vh; padding: 32px 16px; font-family: 'Geist', system-ui, sans-serif; }
    .rc-wrap { max-width: 720px; margin: 0 auto; }
    .rc-bar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
    .rc { background: #fff; color: #18181b; border-radius: 16px; padding: 40px 44px; box-shadow: 0 30px 90px rgba(0,0,0,.55); }
    .rc-top { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
    .rc-top h1 { margin: 0; font-size: 26px; letter-spacing: -0.03em; }
    .rc-top .biz { font-size: 13px; color: #52525b; line-height: 1.6; margin-top: 4px; }
    .rc-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: #dcfce7; color: #15803d; font-size: 13px; font-weight: 600; }
    .rc-badge.prev { background: #f4f4f5; color: #52525b; }
    .rc-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 30px 0; padding: 16px 0; border-top: 1px solid #e4e4e7; border-bottom: 1px solid #e4e4e7; font-size: 13px; }
    .rc-meta span { display: block; color: #71717a; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
    .rc-meta b { font-weight: 600; }
    .rc-to { font-size: 13.5px; line-height: 1.6; margin-bottom: 22px; }
    .rc-to span { display: block; color: #71717a; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: #71717a; font-weight: 600; padding: 8px 0; border-bottom: 1px solid #18181b; }
    td { padding: 11px 0; border-bottom: 1px solid #f4f4f5; }
    .r { text-align: right; }
    .rc-sum { margin-left: auto; width: 280px; margin-top: 14px; font-size: 14px; }
    .rc-sum div { display: flex; justify-content: space-between; padding: 5px 0; color: #52525b; }
    .rc-sum .t { border-top: 1px solid #18181b; margin-top: 6px; padding-top: 10px; color: #18181b; font-size: 18px; font-weight: 700; }
    .rc-foot { margin-top: 34px; font-size: 13px; color: #52525b; line-height: 1.6; }
    .rc-note { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #fafafa; }
    .rc-err { color: #e4e4e7; text-align: center; padding: 60px 0; }
    @media (max-width: 600px) { .rc { padding: 26px 20px; } .rc-meta { grid-template-columns: 1fr 1fr; } .rc-top { flex-direction: column; } }
    @media print { body { background: #fff; padding: 0; } .rc-bar { display: none; } .rc { box-shadow: none; padding: 0; } }
  </style>
</head>
<body>
  <div class="rc-wrap">
    <div class="rc-bar"><button class="btn ghost small" type="button" id="print">Print or save as PDF</button></div>
    <div id="doc" class="rc-err">Loading…</div>
  </div>
<script type="module">
  const token = location.pathname.split('/').pop();
  const preview = new URLSearchParams(location.search).get('preview') === '1';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const date = (d) => (d ? new Date(`${d}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }) : '');
  document.getElementById('print').onclick = () => window.print();
  try {
    const r = await fetch(`/api/r/${encodeURIComponent(token)}${preview ? '?preview=1' : ''}`, { cache: 'no-store' });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'This receipt link is not valid');
    const d = await r.json();
    const m = (v) => new Intl.NumberFormat('en-US', { style: 'currency', currency: d.currency }).format(v);
    const method = d.method === 'PayPal' ? 'PayPal' : d.method.charAt(0).toUpperCase() + d.method.slice(1).replace(/_/g, ' ');
    document.title = `Receipt ${d.receipt}`;
    const el = document.getElementById('doc');
    el.className = 'rc';
    el.innerHTML = `
      <div class="rc-top">
        <div><h1>Receipt</h1><div class="biz"><b>${esc(d.business || 'Your business')}</b>${d.owner ? `<br>${esc(d.owner)}` : ''}${d.businessEmail ? `<br>${esc(d.businessEmail)}` : ''}${d.website ? `<br>${esc(d.website)}` : ''}</div></div>
        <span class="rc-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Paid in full</span>
      </div>
      <div class="rc-meta"><div><span>Receipt</span><b>${esc(d.receipt)}</b></div><div><span>Invoice</span><b>#${esc(d.invoice)}</b></div><div><span>Paid on</span><b>${esc(date(d.paidDate))}</b></div><div><span>Paid by</span><b>${esc(method)}</b></div></div>
      <div class="rc-to"><span>Received from</span><b>${esc(d.client.name)}</b>${d.client.company ? `<br>${esc(d.client.company)}` : ''}<br>${esc(d.client.email)}</div>
      <table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>
        ${d.items.map((i) => `<tr><td>${esc(i.name)}</td><td class="r">${i.quantity}</td><td class="r">${m(i.unitPrice)}</td><td class="r">${m(i.amount)}</td></tr>`).join('')}
      </tbody></table>
      <div class="rc-sum">
        <div><span>Subtotal</span><span>${m(d.subtotal)}</span></div>
        ${d.discount ? `<div><span>Early-pay discount</span><span>−${m(d.discount)}</span></div>` : ''}
        ${d.tax ? `<div><span>Sales tax (${d.taxPercent}%)</span><span>${m(d.tax)}</span></div>` : ''}
        <div class="t"><span>Amount paid</span><span>${m(d.total)}</span></div>
      </div>
      <div class="rc-foot">Thank you for your payment. Keep this receipt for your records.</div>`;
  } catch (e) {
    document.getElementById('doc').textContent = e.message;
  }
</script>
</body>
</html>
