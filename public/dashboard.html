<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPilot · Dashboard</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#060914">
</head>
<body>
<main>
  <div class="dash-top">
    <div>
      <h1>Your money, at a glance</h1>
      <p class="lede" id="asof" style="margin:0"></p>
    </div>
    <button class="btn ghost" id="syncBtn" title="Checks for payments and imports invoices you created on PayPal">Sync with PayPal</button>
  </div>

  <section class="figures" id="figures" aria-label="Key figures. Select one to filter the invoice list."></section>

  <section class="panel brief" style="margin-bottom:26px" aria-live="polite">
    <div class="brief-head">
      <h2 style="margin:0">Money brief</h2>
      <span class="muted" id="briefMeta">A step-by-step report on your earnings, best customers and overdue money, with AI recommendations.</span>
      <button class="btn" id="briefBtn">Generate brief</button>
    </div>
    <div id="briefBody"></div>
  </section>

  <div class="grid2">
    <section class="panel chart">
      <h2>Money received per month</h2>
      <p class="muted" style="margin:-6px 0 8px;font-size:13px">Select a month to see every payment received in it.</p>
      <div id="chart"></div>
      <div id="monthDetail"></div>
    </section>
    <div class="stack" style="gap:26px">
      <section class="panel">
        <h2>Top customers</h2>
        <ol class="leader" id="leaders"></ol>
      </section>
      <section class="panel">
        <h2>Recent activity</h2>
        <ul class="feed" id="feed"></ul>
      </section>
    </div>
  </div>

  <section class="panel">
    <div class="table-tools">
      <h2 style="margin:0">Invoices</h2>
      <div class="seg" role="group" aria-label="Filter invoices" id="seg">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="open">Open</button>
        <button data-f="overdue">Overdue</button>
        <button data-f="paid">Paid</button>
      </div>
      <input id="search" type="search" placeholder="Search client or work" aria-label="Search invoices">
      <a class="btn ghost small" href="/api/invoices.csv" download>Export CSV</a>
    </div>
    <div class="muted" id="filterNote" style="font-size:13px;margin:8px 0 0"></div>
    <div class="table-wrap" id="invoices"></div>
  </section>
</main>
<script type="module" src="/dashboard.js"></script>
</body>
</html>
