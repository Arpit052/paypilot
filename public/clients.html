<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPilot · Clients</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#09090b">
</head>
<body>
<main>
  <div class="dash-top">
    <div>
      <h1>Clients</h1>
      <p class="lede" style="margin:0">Who you work with, how they pay, and the retainers that bill themselves.</p>
    </div>
  </div>

  <section class="panel" style="padding:0!important">
    <div class="sec-pad"><h2>All clients</h2><input id="q" type="search" placeholder="Search clients" aria-label="Search clients"></div>
    <div class="table-wrap" id="clients"></div>
  </section>

  <div class="sec-head" style="margin-top:34px">
    <div><h2 style="font-size:16px">Retainers</h2><p class="muted small" style="margin:2px 0 0">Regular work billed on a schedule. On each date the invoice is drafted for you to approve; nothing is sent on its own.</p></div>
    <button class="btn small" id="newRet" style="margin-left:auto">New retainer</button>
  </div>
  <div class="ret-grid" id="retainers"></div>
</main>

<div class="cdrawer hidden" id="drawer" role="dialog" aria-modal="true" aria-label="New retainer">
  <div class="cdrawer-scrim" data-close></div>
  <div class="cdrawer-panel">
    <div class="cdrawer-head"><b>New retainer</b><button class="btn ghost small" data-close type="button">Close</button></div>
    <form id="recForm" class="ret-form">
      <label for="rClient">Client</label>
      <select id="rClient"></select>
      <div id="newClientFields" class="hidden two">
        <div><label for="rName">Name</label><input id="rName" placeholder="Priya Raman"></div>
        <div><label for="rEmail">Email</label><input id="rEmail" type="email" placeholder="name@company.com"></div>
      </div>
      <label for="rDesc">What it's for</label>
      <input id="rDesc" required placeholder="Monthly design retainer">
      <div class="two">
        <div><label for="rAmount">Amount (<span class="cur"></span>)</label><input id="rAmount" type="number" min="1" step="0.01" required placeholder="725"></div>
        <div><label for="rFreq">Repeats</label><select id="rFreq"><option value="monthly">Every month</option><option value="weekly">Every week</option></select></div>
      </div>
      <div class="two">
        <div><label for="rStart">First invoice</label><input id="rStart" type="date" required></div>
        <div><label for="rDue">Client pays within</label><select id="rDue"><option value="0">Due on receipt</option><option value="7">7 days</option><option value="15">15 days</option><option value="30">30 days</option></select></div>
      </div>
      <div class="ret-preview" id="retPreview"></div>
      <div class="slip-error" id="recErr" role="alert"></div>
      <button class="btn" type="submit" style="width:100%">Create retainer</button>
    </form>
  </div>
</div>
<script type="module" src="/clients.js"></script>
</body>
</html>
