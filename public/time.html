<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPilot · Time</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>Time tracking</h1>
  <p class="lede">Start the timer when you begin working for a client and stop it when you're done. When you're ready to bill, turn the unbilled hours into an invoice draft in one click.</p>

  <section class="panel timer-card" style="margin-bottom:26px">
    <div>
      <div class="clock idle num" id="clock" aria-live="off">00:00:00</div>
      <p class="muted" id="clockSub" style="margin:10px 0 0">No timer running.</p>
    </div>
    <form id="timerForm">
      <div class="form-grid">
        <div class="full"><label for="tClient">Client</label><select id="tClient"></select></div>
        <div id="tNewClient" class="full hidden"><div class="form-grid">
          <div><label for="tName">Client name</label><input id="tName"></div>
          <div><label for="tEmail">Client email</label><input id="tEmail" type="email"></div>
        </div></div>
        <div><label for="tTask">What are you working on?</label><input id="tTask" placeholder="e.g. Homepage design"></div>
        <div><label for="tRate">Hourly rate (<span class="cur"></span>)</label><input id="tRate" type="number" min="1" step="0.01"></div>
      </div>
      <div class="slip-actions"><button class="btn go" id="toggleBtn" type="submit">Start timer</button></div>
      <div class="slip-error" id="tErr" role="alert"></div>
    </form>
  </section>

  <div class="grid2" style="align-items:start">
    <section class="panel">
      <h2>Ready to invoice</h2>
      <div id="unbilled"></div>
      <details style="margin-top:16px">
        <summary style="cursor:pointer;color:var(--cobalt);font-weight:600">Add time manually</summary>
        <form id="manualForm" style="margin-top:10px">
          <div class="form-grid">
            <div class="full"><label for="mClient">Client</label><select id="mClient"></select></div>
            <div><label for="mTask">Task</label><input id="mTask" placeholder="e.g. Logo revisions"></div>
            <div><label for="mHours">Hours</label><input id="mHours" type="number" min="0.1" max="24" step="0.25" required></div>
            <div><label for="mDate">Date</label><input id="mDate" type="date"></div>
            <div><label for="mRate">Hourly rate (<span class="cur"></span>)</label><input id="mRate" type="number" min="1" step="0.01"></div>
          </div>
          <div class="slip-actions"><button class="btn ghost" type="submit">Add entry</button></div>
          <div class="slip-error" id="mErr" role="alert"></div>
        </form>
      </details>
    </section>
    <section class="panel table-wrap">
      <h2>Recent sessions</h2>
      <div id="entries"></div>
    </section>
  </div>
</main>
<script type="module">
  import { api, header, esc, money, fmtDate, toast, clockText, refreshTimerPill } from '/common.js';
  const cfg = await header('time');
  const $ = (id) => document.getElementById(id);
  document.querySelectorAll('.cur').forEach((e) => (e.textContent = cfg.currency));
  $('mDate').value = cfg.today;
  let tick = null;
  let state = { running: null };

  async function loadClients() {
    const { clients } = await api('/api/clients');
    const opts = clients.map((c) => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    $('tClient').innerHTML = opts + '<option value="__new">+ New client…</option>';
    $('mClient').innerHTML = opts;
    if (!clients.length) $('tClient').value = '__new';
    $('tNewClient').classList.toggle('hidden', $('tClient').value !== '__new');
    await fillRate('tClient', 'tRate');
    await fillRate('mClient', 'mRate');
  }
  async function fillRate(sel, input) {
    const id = $(sel).value;
    if (!id || id === '__new') return;
    const { hourlyRate } = await api(`/api/time/rate/${encodeURIComponent(id)}`);
    $(input).value = hourlyRate;
  }
  $('tClient').addEventListener('change', () => {
    $('tNewClient').classList.toggle('hidden', $('tClient').value !== '__new');
    fillRate('tClient', 'tRate');
  });
  $('mClient').addEventListener('change', () => fillRate('mClient', 'mRate'));

  function renderClock() {
    clearInterval(tick);
    const r = state.running;
    $('toggleBtn').textContent = r ? 'Stop timer' : 'Start timer';
    $('toggleBtn').className = `btn ${r ? 'stop' : 'go'}`;
    ['tClient', 'tTask', 'tRate', 'tName', 'tEmail'].forEach((id) => ($(id).disabled = Boolean(r)));
    if (!r) {
      $('clock').textContent = '00:00:00';
      $('clock').classList.add('idle');
      $('clockSub').textContent = 'No timer running.';
      return;
    }
    const start = new Date(r.startedAt).getTime();
    $('clock').classList.remove('idle');
    $('clockSub').innerHTML = `Working for <b>${esc(r.client)}</b> on ${esc(r.task)} · ${money(r.hourlyRate, cfg.currency)}/h · started ${new Date(r.startedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    const upd = () => {
      const ms = Date.now() - start;
      $('clock').textContent = clockText(ms);
      document.title = `${clockText(ms)} · PayPilot`;
    };
    upd();
    tick = setInterval(upd, 1000);
  }

  async function load() {
    const t = await api('/api/time');
    state.running = t.running;
    renderClock();
    refreshTimerPill(t.running);
    $('unbilled').innerHTML = t.unbilled.length
      ? `<table class="data"><thead><tr><th>Client</th><th class="r">Hours</th><th class="r">Value</th><th></th></tr></thead><tbody>${t.unbilled
          .map((u) => `<tr><td>${esc(u.client)}</td><td class="r num">${u.hours}</td><td class="r num">${money(u.value, u.currency)}</td><td class="r"><button class="btn small" data-invoice="${esc(u.clientId)}">Create invoice draft</button></td></tr>`)
          .join('')}</tbody></table>`
      : '<div class="empty">No unbilled time. Start the timer above when you begin working.</div>';
    $('entries').innerHTML = t.entries.length
      ? `<table class="data"><thead><tr><th>Date</th><th>Client</th><th>Task</th><th class="r">Time</th><th class="r">Value</th><th></th></tr></thead><tbody>${t.entries
          .map((e) => {
            const h = Math.floor(e.minutes / 60), m = e.minutes % 60;
            return `<tr><td>${fmtDate(e.startedAt.slice(0, 10))}</td><td>${esc(e.client)}</td><td class="muted">${esc(e.task)}</td><td class="r num">${h ? `${h}h ` : ''}${m}m</td><td class="r num">${money(e.value, cfg.currency)}</td>
              <td class="r">${e.billedInvoiceId ? '<span class="pill PAID">Invoiced</span>' : `<button class="btn ghost small" data-del="${esc(e.id)}">Delete</button>`}</td></tr>`;
          })
          .join('')}</tbody></table>`
      : '<div class="empty">No sessions yet.</div>';
  }

  $('timerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('tErr').textContent = '';
    try {
      if (state.running) {
        const { stopped } = await api('/api/time/stop', { body: {} });
        toast(`Stopped. ${Math.floor(stopped.minutes / 60)}h ${stopped.minutes % 60}m logged for ${stopped.client}`);
      } else {
        const isNew = $('tClient').value === '__new';
        await api('/api/time/start', {
          body: isNew
            ? { clientName: $('tName').value, clientEmail: $('tEmail').value, task: $('tTask').value, hourlyRate: Number($('tRate').value) }
            : { clientId: $('tClient').value, task: $('tTask').value, hourlyRate: Number($('tRate').value) },
        });
        if (isNew) await loadClients();
      }
      await load();
    } catch (err) {
      $('tErr').textContent = err.message;
    }
  });

  $('manualForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('mErr').textContent = '';
    try {
      await api('/api/time/entries', { body: { clientId: $('mClient').value, task: $('mTask').value, hours: Number($('mHours').value), date: $('mDate').value, hourlyRate: Number($('mRate').value) } });
      toast('Time added');
      $('mHours').value = '';
      $('mTask').value = '';
      load();
    } catch (err) {
      $('mErr').textContent = err.message;
    }
  });

  document.addEventListener('click', async (e) => {
    const inv = e.target.dataset?.invoice;
    const del = e.target.dataset?.del;
    if (inv) {
      e.target.disabled = true;
      try {
        const r = await api('/api/time/invoice', { body: { clientId: inv } });
        toast(`Invoice draft for ${r.hours} h (${money(r.total, cfg.currency)}) is in your approval tray`);
        setTimeout(() => (location.href = '/'), 1200);
      } catch (err) {
        toast(err.message);
        e.target.disabled = false;
      }
    }
    if (del) {
      await api(`/api/time/entries/${del}/delete`, { body: {} });
      load();
    }
  });

  await loadClients();
  await load();
</script>
</body>
</html>
