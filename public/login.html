<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPilot · Sign in</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#060914">
</head>
<body>
<main class="login">
  <div class="brand-big" id="brandBig"></div>
  <form class="slip" id="form">
    <div class="slip-kind" style="font-size:18px">Welcome back</div>
    <p class="muted" style="margin:4px 0 14px">Enter the passcode to open this workspace.</p>
    <label for="pw">Passcode</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button class="btn" type="submit" style="width:100%;justify-content:center">Sign in</button>
    <div class="slip-error" id="err" role="alert"></div>
  </form>
</main>
<script type="module">
  import { LOGO } from '/common.js';
  document.getElementById('brandBig').innerHTML = `${LOGO}<span class="wordmark">PayPilot</span>`;
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }),
    });
    if (res.ok) location.href = '/';
    else err.textContent = (await res.json().catch(() => ({}))).error || 'Sign in failed.';
  });
</script>
</body>
</html>
