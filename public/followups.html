<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPilot · Collections</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#09090b">
</head>
<body>
<main class="col3">
  <div class="dash-top">
    <div>
      <h1>Collections</h1>
      <p class="lede" style="margin:0">Every unpaid invoice, what's been sent, and what to do next.</p>
    </div>
    <button class="btn ghost small" id="chaseAll" style="margin-left:auto">Draft reminders for all late</button>
  </div>

  <section class="stat-strip" id="stats" aria-label="Money owed"></section>

  <div class="col3-grid">
    <section class="panel list-panel">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-t="attention" aria-selected="true">Needs attention <span></span></button>
        <button role="tab" data-t="upcoming">Upcoming <span></span></button>
        <button role="tab" data-t="all">All unpaid <span></span></button>
        <button role="tab" data-t="sent">Sent <span></span></button>
      </div>
      <div id="list"></div>
    </section>

    <aside class="panel rail">
      <div class="rail-h"><h2>Next 14 days</h2><span class="muted small" id="railSub"></span></div>
      <ol class="rail-list" id="rail"></ol>
    </aside>
  </div>
</main>

<div class="cdrawer hidden" id="drawer" role="dialog" aria-modal="true" aria-label="Review draft">
  <div class="cdrawer-scrim" data-close></div>
  <div class="cdrawer-panel">
    <div class="cdrawer-head"><b id="drawerTitle">Review draft</b><button class="btn ghost small" data-close>Close</button></div>
    <div id="drawerBody"></div>
  </div>
</div>
<script type="module" src="/followups.js"></script>
</body>
</html>
