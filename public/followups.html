<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPilot · Collections</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#060914">
</head>
<body>
<main class="coll">
  <div class="dash-top">
    <div>
      <h1>Collections</h1>
      <p class="lede" style="margin:0">Get paid without the awkward follow-ups. Autopilot writes each reminder on the right day; you just approve.</p>
    </div>
    <button class="ap-toggle" id="apToggle" role="switch" aria-checked="true"><span class="ap-knob"></span><span id="apLabel">Autopilot on</span></button>
  </div>

  <section class="coll-stats" id="stats" aria-label="Money owed"></section>

  <div class="coll-grid">
    <div>
      <div class="sec-head"><h2>Needs your attention</h2><span class="muted" id="attnCount"></span><button class="btn ghost small" id="chaseAll" style="margin-left:auto">Draft reminders for all late</button></div>
      <div id="attention" class="attn-list"></div>
      <div class="sec-head" style="margin-top:28px"><h2>On track</h2><span class="muted" id="trackCount"></span></div>
      <div id="ontrack" class="track-list"></div>
    </div>

    <aside class="coll-side">
      <a class="panel ap-mini" href="/settings#autopilot" id="planMini"></a>

      <section class="panel">
        <div class="sec-head"><h2>Coming up</h2><button class="btn ghost small hidden" id="runNow" style="margin-left:auto">Draft today's now</button></div>
        <ul class="upcoming" id="upcoming"></ul>
      </section>

      <section class="panel">
        <h2>Recently sent</h2>
        <ul class="sent-list" id="recent"></ul>
      </section>
    </aside>
  </div>
</main>

<div class="cdrawer hidden" id="drawer" role="dialog" aria-modal="true" aria-label="Review draft">
  <div class="cdrawer-scrim" data-close></div>
  <div class="cdrawer-panel">
    <div class="cdrawer-head"><b id="drawerTitle">Review draft</b><button class="btn ghost small" data-close>Close</button></div>
    <div id="drawerBody"></div>
  </div>
</div>
<script type="module" src="/followups.js"></script>
</body>
</html>
