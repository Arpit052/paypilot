<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPilot · Receipts</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#09090b">
</head>
<body>
<main>
  <div class="dash-top">
    <div>
      <h1>Receipts</h1>
      <p class="lede" style="margin:0">Every payment gets a numbered receipt. PayPal emails one when a client pays through PayPal; for bank transfers and cash, send yours from here.</p>
    </div>
  </div>
  <section class="rx-stats" id="stats"></section>
  <section class="panel" style="padding:0!important;margin-top:18px">
    <div class="sec-pad rx-head">
      <div class="seg small-seg" role="group" aria-label="Filter" id="filter">
        <button data-f="needed" aria-pressed="false">Needs a receipt</button>
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="sent" aria-pressed="false">Sent</button>
      </div>
      <input id="q" class="rx-q" type="search" placeholder="Search client or number" aria-label="Search receipts">
    </div>
    <div class="table-wrap" id="list"></div>
  </section>
</main>
<script type="module" src="/receipts.js"></script>
</body>
</html>
